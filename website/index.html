<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ArcaneSync</title>
        <link rel="stylesheet" href="style.css"/>
        <link rel="icon" type="image/png" href="img/icon.png">
        <style>
            /* Accueil : choix de l'interface, une par rôle à la table. */
            .page-index .choix-interface { text-decoration: none; }
            .page-index .choix-interface button { height: 100%; }
            .page-index .choix-interface span {
                display: block;
                margin-top: 8px;
                font-family: 'Segoe UI', system-ui, sans-serif;
                font-size: 14px;
                opacity: .9;
            }
            .page-index .choix-icone { font-size: 32px; display: block; margin-bottom: 6px; }
        </style>
    </head>
    <body class="page-index">
        <h1>ArcaneSync</h1>
        <p>Choisissez votre interface</p>
        <div class="button-container">
            <a class="choix-interface" href="mj.html" data-interface="mj">
                <button id="btn_mj" type="button">
                    <b class="choix-icone">🎲</b>MJ
                    <span>Partie, joueurs, mobs, carte et tableau blanc</span>
                </button>
            </a>
            <a class="choix-interface" href="selecte_player.html" data-interface="joueur">
                <button id="btn_select_player" type="button">
                    <b class="choix-icone">👤</b>Joueur
                    <span>Choisir son personnage : jeu, fiche et carte</span>
                </button>
            </a>
            <a class="choix-interface" href="ecran.html" data-interface="ecran">
                <button id="btn_ecran" type="button">
                    <b class="choix-icone">🖥️</b>Écran
                    <span>Affichage partagé de la carte et du tableau blanc</span>
                </button>
            </a>
        </div>
        <script>
            // Le choix d'interface règle la barre de navigation des pages
            // partagées (création de personnage, tableau blanc).
            document.querySelectorAll('.choix-interface').forEach(lien => {
                lien.addEventListener('click', () => {
                    try { localStorage.setItem('arcanesync-interface', lien.dataset.interface); } catch (_) {}
                });
            });
        </script>
    </body>
</html>
