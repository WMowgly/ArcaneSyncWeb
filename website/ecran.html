<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Écran — ArcaneSync</title>
  <link rel="icon" type="image/png" href="img/icon.png">
  <link rel="stylesheet" href="polices/polices.css">
  <script src="/socket.io/socket.io.js"></script>
  <style>
    /* Écran partagé de la table : affichage seul, plein cadre.
       Deux vues : la carte (ce que voit le groupe) et le tableau blanc. */
    :root { --parchemin: #fdf6e3; --encre: #3b2f1e; --bord: #8b5e3c; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column;
      background: var(--parchemin); color: var(--encre);
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .ecran-barre {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 6px 12px; background: var(--bord); color: #fefae0;
    }
    .ecran-barre h1 {
      margin: 0 8px 0 0; font-family: 'Uncial Antiqua', cursive;
      font-size: 18px; font-weight: 400;
    }
    .ecran-barre button, .ecran-barre a, .ecran-barre .vue-indicateur {
      font: inherit; font-size: 14px; padding: 5px 12px; border-radius: 6px;
      border: 1px solid #fefae0; background: transparent; color: #fefae0;
      cursor: pointer; text-decoration: none;
    }
    /* La vue est choisie par le MJ : l'Écran ne fait que l'indiquer. */
    .ecran-barre .vue-indicateur { cursor: default; opacity: .55; }
    .ecran-barre .vue-indicateur.actif { background: #fefae0; color: var(--encre); font-weight: 600; opacity: 1; }
    #ecran-titre { flex: 1; font-size: 14px; opacity: .9; }
    #ecran-statut { font-size: 13px; }

    /* Corps : la vue (carte ou tableau blanc) et, à sa droite, les PV du groupe. */
    .ecran-corps { flex: 1; min-height: 0; display: flex; }
    .vue { flex: 1; min-height: 0; min-width: 0; }
    .vue[hidden] { display: none; }
    #vue-carte { position: relative; padding: 8px; }
    #vue-carte .canvas-wrap {
      width: 100%; height: 100%; display: flex;
      align-items: center; justify-content: center; overflow: auto;
    }
    #carte-vide {
      position: absolute; inset: 0; display: flex; align-items: center;
      justify-content: center; font-size: 20px; opacity: .7;
    }
    #carte-vide[hidden] { display: none; }
    #vue-tableau iframe { width: 100%; height: 100%; border: 0; display: block; }

    /* Initiative : panneau posé sur la vue, visible pendant un combat. */
    #initiative {
      position: fixed; top: 52px; right: 12px; z-index: 5;
      width: min(260px, calc(100vw - 24px)); max-height: calc(100vh - 70px); overflow: auto;
      background: var(--parchemin); border: 2px solid var(--bord); border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, .25); padding: 10px 12px;
    }
    #initiative[hidden] { display: none; }
    #initiative h2 { margin: 0 0 6px; font-family: 'Uncial Antiqua', cursive; font-size: 17px; font-weight: 400; }
    #initiative ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
    #initiative li { padding: 5px 8px; border-radius: 6px; border: 1px solid #e0cfa9; background: #fffdf6; font-size: 15px; }
    #initiative li.courant { border: 2px solid var(--bord); background: #f3e3c8; font-weight: 700; }
    #initiative li.courant::before { content: '▶ '; }
    #initiative li.hors-jeu { opacity: .5; text-decoration: line-through; }
    #initiative-cache { margin: 6px 0 0; font-size: 13px; font-style: italic; opacity: .8; }
    /* Le panneau d'initiative reste sur la carte, à gauche de la colonne du groupe. */
    body.avec-groupe #initiative { right: calc(var(--largeur-groupe) + 12px); }

    /* V2.4 — Rideau baissé par le MJ : rien de la partie n'est visible, pas
       même le nom de la carte. */
    #rideau {
      position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: radial-gradient(circle at center, #4a3423 0%, #2a1d12 70%, #1a120b 100%); color: #f4e6c8;
    }
    #rideau[hidden] { display: none; }
    #rideau img { width: min(140px, 22vw); opacity: .9; filter: drop-shadow(0 4px 12px rgba(0, 0, 0, .5)); }
    #rideau p { margin: 0; font-family: 'Uncial Antiqua', cursive; font-size: clamp(22px, 3.4vw, 46px); text-align: center; }

    /* V2.4 — PV du groupe : colonne à droite de la carte, lisible de loin. */
    :root { --largeur-groupe: 250px; }
    #groupe {
      flex: 0 0 var(--largeur-groupe); display: flex; flex-direction: column; gap: 10px;
      padding: 10px; overflow-y: auto; background: #f3e9d2; border-left: 3px solid var(--bord);
    }
    #groupe[hidden] { display: none; }
    .pj {
      flex: 0 0 auto; min-width: 0; padding: 6px 10px 8px;
      border: 2px solid #d9c8a9; border-radius: 10px; background: #fffdf6;
    }
    .pj.actif { border-color: #d4af37; background: #fff6d9; box-shadow: 0 0 0 3px rgba(212, 175, 55, .45); }
    .pj-tete { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
    .pj-nom { font-weight: 700; font-size: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pj.actif .pj-nom::before { content: '▶ '; color: #9a7410; }
    .pj-agonie { flex: 0 0 auto; font-size: 14px; font-weight: 700; color: #9b2c2c; }
    .pj-barre {
      position: relative; height: 24px; margin-top: 5px; overflow: hidden;
      border: 2px solid var(--bord); border-radius: 12px; background: #e9e2d2;
    }
    .pj-remplie { position: absolute; inset: 0 auto 0 0; }
    .pj-texte {
      position: absolute; inset: 0; text-align: center; line-height: 20px;
      font-size: 16px; font-weight: 700; color: #fff;
      text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
    }

    /* Écran étroit (tablette en portrait) : les PV repassent sous la carte. */
    @media (max-width: 760px) {
      .ecran-corps { flex-direction: column; }
      #groupe {
        flex: 0 0 auto; flex-direction: row; flex-wrap: wrap; justify-content: center;
        overflow: visible; border-left: 0; border-top: 3px solid var(--bord);
      }
      .pj { flex: 1 1 180px; max-width: 280px; }
      body.avec-groupe #initiative { right: 12px; max-height: calc(100vh - 190px); }
    }
  </style>
  <script src="outils-communs.js"></script>
</head>
<body>
  <header class="ecran-barre">
    <h1>🖥️ Écran</h1>
    <span class="vue-indicateur actif" data-vue="carte" title="Vue choisie par le MJ">🗺️ Carte</span>
    <span class="vue-indicateur" data-vue="tableau" title="Vue choisie par le MJ">📝 Tableau blanc</span>
    <span id="ecran-titre"></span>
    <span id="ecran-statut">Connexion…</span>
    <button type="button" id="btn-plein-ecran" title="Plein écran">⛶</button>
    <a href="index.html" title="Retour à l'accueil">Accueil</a>
  </header>

  <div class="ecran-corps">
  <section id="vue-carte" class="vue">
    <div class="canvas-wrap"><canvas id="map-canvas" width="600" height="400"></canvas></div>
    <p id="carte-vide" hidden>Aucune carte active.</p>
  </section>

  <section id="vue-tableau" class="vue" hidden>
    <!-- Chargé à la première ouverture : le tableau blanc en spectateur. -->
  </section>

  <!-- V2.4 : rideau baissé par le MJ (préparation). -->
  <div id="rideau" hidden aria-live="polite">
    <img src="img/icon.png" alt="">
    <p>La partie reprend dans un instant…</p>
  </div>

  <!-- V2.4 : PV du groupe, à droite de la carte comme du tableau blanc. -->
  <aside id="groupe" hidden aria-label="Points de vie du groupe"></aside>
  </div><!-- fin de .ecran-corps -->

  <aside id="initiative" hidden aria-live="polite">
    <h2>⚔️ Round <span id="initiative-round">1</span></h2>
    <ol id="initiative-ordre"></ol>
    <p id="initiative-cache" hidden>Un adversaire agit…</p>
  </aside>

  <script src="map-core.js"></script>
  <script>
  (function () {
    'use strict';

    // --- Carte : projection « écran » du serveur (vision du groupe) --------
    const socket = ArcaneMap.connect('ecran', '');
    const renderer = ArcaneMap.createRenderer(document.getElementById('map-canvas'), { ecran: true });
    renderer.setOption('showCoords', false);
    // Consultation de l’affichage (contrôles automatiques, diagnostic).
    window.ArcaneRendu = renderer;

    const statut = document.getElementById('ecran-statut');
    const titre = document.getElementById('ecran-titre');

    function appliquerCarte(payload) {
      // Projection éventuellement allégée : voir map-core.setMap().
      if (!renderer.setMap(payload)) {
        socket.emit('mapRequest');
        return;
      }
      document.getElementById('carte-vide').hidden = !!payload;
      titre.textContent = payload?.nom || '';
    }

    socket.on('mapState', appliquerCarte);
    socket.on('mapDrawPreview', apercu => renderer.pushPreview(apercu));
    // V2.4 — Ping du MJ : cercle pulsant à l'endroit montré.
    socket.on('mapPing', ping => { if (ping?.mapId && ping.mapId === renderer.state.map?.id) renderer.pushPing(ping); });
    socket.on('connect', () => {
      statut.textContent = '🟢 Synchronisé';
      socket.emit('mapRequest');
    });
    socket.on('disconnect', () => { statut.textContent = '🔴 Reconnexion…'; });
    socket.on('connect_error', () => { statut.textContent = '🔴 Serveur injoignable'; });

    // --- Vue affichée : choisie par le MJ depuis son interface ----------------
    function afficher(vue) {
      document.querySelectorAll('[data-vue]').forEach(b => b.classList.toggle('actif', b.dataset.vue === vue));
      document.getElementById('vue-carte').hidden = vue !== 'carte';
      document.getElementById('vue-tableau').hidden = vue !== 'tableau';

      const conteneur = document.getElementById('vue-tableau');
      if (vue === 'tableau' && !conteneur.firstElementChild) {
        const cadre = document.createElement('iframe');
        cadre.src = 'tableau.html?role=viewer&embed=1';
        cadre.title = 'Tableau blanc';
        conteneur.appendChild(cadre);
      }
      if (vue === 'carte') renderer.resize();
    }

    // Le serveur envoie la vue à la connexion, puis à chaque choix du MJ.
    socket.on('ecranVue', ({ vue } = {}) => afficher(vue === 'tableau' ? 'tableau' : 'carte'));

    // --- Initiative : affichée pendant un combat, par-dessus la vue ---------
    // Projection « table » : les créatures cachées par le MJ n'y figurent pas.
    const echapper = ArcaneOutils.echapper;   // outils-communs.js

    // V2.4 — Combattant dont c'est le tour (null hors combat, ou quand une
    // créature cachée agit : le serveur ne la nomme pas à la table).
    let actifId = null;

    async function chargerInitiative() {
      let etat;
      try { etat = await (await fetch('/api/initiative')).json(); } catch (_) { return; }
      actifId = etat.actif ? etat.courant : null;
      renderer.setOption('actifId', actifId);
      renderGroupe();
      const panneau = document.getElementById('initiative');
      panneau.hidden = !etat.actif || !etat.entrees.length;
      if (panneau.hidden) return;
      document.getElementById('initiative-round').textContent = etat.round;
      document.getElementById('initiative-ordre').innerHTML = etat.entrees.map(e =>
        `<li class="${e.id === etat.courant ? 'courant' : ''}${e.horsJeu ? ' hors-jeu' : ''}">${e.horsJeu ? '💀' : e.kind === 'mob' ? '👹' : '👤'} ${echapper(e.nom)}</li>`).join('');
      document.getElementById('initiative-cache').hidden = etat.courant !== null;
    }

    socket.on('initiativeUpdated', chargerInitiative);
    socket.on('connect', chargerInitiative);
    socket.on('mobUpdated', chargerInitiative);   // créature morte : barrée sans attendre

    // --- V2.4 : bandeau des PV du groupe -----------------------------------
    // Les personnages seulement, barres et chiffres. Les PV sont déjà publics
    // (liste des personnages) ; le bandeau suit les mises à jour en direct.
    const groupe = document.getElementById('groupe');
    let reglages = { groupe: true, cadrage: null, suivreActif: false };
    let joueurs = [];

    function renderGroupe() {
      const visible = reglages.groupe !== false && joueurs.length > 0;
      groupe.hidden = !visible;
      document.body.classList.toggle('avec-groupe', visible);
      if (!visible) return;
      groupe.innerHTML = joueurs.map(j => {
        const max = Math.max(0, Number(j.hp?.max) || 0);
        const cur = Math.max(0, Math.min(Number(j.hp?.current) || 0, max));
        const part = max > 0 ? cur / max : 0;
        const couleur = part > 0.5 ? '#3f7d4a' : part > 0.2 ? '#b08948' : '#8b3e3c';
        const agonie = cur <= 0 || (j.statuts || []).some(s => s?.id === 'agonie');
        const actif = actifId === `player:${j.id}`;
        return `<div class="pj${actif ? ' actif' : ''}" data-id="${echapper(j.id)}">
            <div class="pj-tete"><span class="pj-nom">${echapper(j.nom)}</span>${agonie ? '<span class="pj-agonie">💀 Agonie</span>' : ''}</div>
            <div class="pj-barre"><span class="pj-remplie" style="width:${Math.round(part * 100)}%;background:${couleur}"></span>
              <span class="pj-texte">${cur} / ${max}</span></div>
          </div>`;
      }).join('');
    }

    let minuterieGroupe = null;
    function chargerGroupe() {
      clearTimeout(minuterieGroupe);
      minuterieGroupe = setTimeout(async () => {
        try { joueurs = await (await fetch('/api/session/players')).json(); } catch (_) { return; }
        if (!Array.isArray(joueurs)) joueurs = [];
        renderGroupe();
      }, 150);
    }
    ['sessionUpdated', 'playerUpdate', 'sessionPlayerUpdate'].forEach(evenement => socket.on(evenement, chargerGroupe));
    socket.on('connect', chargerGroupe);

    // --- V2.4 : réglages du MJ (bandeau, cadrage, suivi du combattant) -------
    socket.on('ecranReglages', (nouveaux = {}) => {
      reglages = { ...reglages, ...nouveaux };
      document.getElementById('rideau').hidden = reglages.rideau !== true;
      renderer.setOption('suivreActif', reglages.suivreActif === true);
      renderer.setOption('cadrage', reglages.cadrage || null);
      renderGroupe();
    });

    document.getElementById('btn-plein-ecran').addEventListener('click', () => {
      if (document.fullscreenElement) document.exitFullscreen?.();
      else document.documentElement.requestFullscreen?.();
    });
  })();
  </script>
</body>
</html>
