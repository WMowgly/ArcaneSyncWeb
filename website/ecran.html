<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Écran — ArcaneSync</title>
  <link rel="icon" type="image/png" href="img/icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&display=swap" rel="stylesheet">
  <script src="/socket.io/socket.io.js"></script>
  <style>
    /* Écran partagé de la table : affichage seul, plein cadre.
       Deux vues : la carte (ce que voit le groupe) et le tableau blanc. */
    :root { --parchemin: #fdf6e3; --encre: #3b2f1e; --bord: #8b5e3c; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column;
      background: var(--parchemin); color: var(--encre);
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .ecran-barre {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 6px 12px; background: var(--bord); color: #fefae0;
    }
    .ecran-barre h1 {
      margin: 0 8px 0 0; font-family: 'Uncial Antiqua', cursive;
      font-size: 18px; font-weight: 400;
    }
    .ecran-barre button, .ecran-barre a, .ecran-barre .vue-indicateur {
      font: inherit; font-size: 14px; padding: 5px 12px; border-radius: 6px;
      border: 1px solid #fefae0; background: transparent; color: #fefae0;
      cursor: pointer; text-decoration: none;
    }
    /* La vue est choisie par le MJ : l'Écran ne fait que l'indiquer. */
    .ecran-barre .vue-indicateur { cursor: default; opacity: .55; }
    .ecran-barre .vue-indicateur.actif { background: #fefae0; color: var(--encre); font-weight: 600; opacity: 1; }
    #ecran-titre { flex: 1; font-size: 14px; opacity: .9; }
    #ecran-statut { font-size: 13px; }

    .vue { flex: 1; min-height: 0; }
    .vue[hidden] { display: none; }
    #vue-carte { position: relative; padding: 8px; }
    #vue-carte .canvas-wrap {
      width: 100%; height: 100%; display: flex;
      align-items: center; justify-content: center; overflow: auto;
    }
    #carte-vide {
      position: absolute; inset: 0; display: flex; align-items: center;
      justify-content: center; font-size: 20px; opacity: .7;
    }
    #carte-vide[hidden] { display: none; }
    #vue-tableau iframe { width: 100%; height: 100%; border: 0; display: block; }

    /* Initiative : panneau posé sur la vue, visible pendant un combat. */
    #initiative {
      position: fixed; top: 52px; right: 12px; z-index: 5;
      width: min(260px, calc(100vw - 24px)); max-height: calc(100vh - 70px); overflow: auto;
      background: var(--parchemin); border: 2px solid var(--bord); border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, .25); padding: 10px 12px;
    }
    #initiative[hidden] { display: none; }
    #initiative h2 { margin: 0 0 6px; font-family: 'Uncial Antiqua', cursive; font-size: 17px; font-weight: 400; }
    #initiative ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
    #initiative li { padding: 5px 8px; border-radius: 6px; border: 1px solid #e0cfa9; background: #fffdf6; font-size: 15px; }
    #initiative li.courant { border: 2px solid var(--bord); background: #f3e3c8; font-weight: 700; }
    #initiative li.courant::before { content: '▶ '; }
    #initiative-cache { margin: 6px 0 0; font-size: 13px; font-style: italic; opacity: .8; }
  </style>
</head>
<body>
  <header class="ecran-barre">
    <h1>🖥️ Écran</h1>
    <span class="vue-indicateur actif" data-vue="carte" title="Vue choisie par le MJ">🗺️ Carte</span>
    <span class="vue-indicateur" data-vue="tableau" title="Vue choisie par le MJ">📝 Tableau blanc</span>
    <span id="ecran-titre"></span>
    <span id="ecran-statut">Connexion…</span>
    <button type="button" id="btn-plein-ecran" title="Plein écran">⛶</button>
    <a href="index.html" title="Retour à l'accueil">Accueil</a>
  </header>

  <section id="vue-carte" class="vue">
    <div class="canvas-wrap"><canvas id="map-canvas" width="600" height="400"></canvas></div>
    <p id="carte-vide" hidden>Aucune carte active.</p>
  </section>

  <section id="vue-tableau" class="vue" hidden>
    <!-- Chargé à la première ouverture : le tableau blanc en spectateur. -->
  </section>

  <aside id="initiative" hidden aria-live="polite">
    <h2>⚔️ Round <span id="initiative-round">1</span></h2>
    <ol id="initiative-ordre"></ol>
    <p id="initiative-cache" hidden>Un adversaire agit…</p>
  </aside>

  <script src="map-core.js"></script>
  <script>
  (function () {
    'use strict';

    // --- Carte : projection « écran » du serveur (vision du groupe) --------
    const socket = ArcaneMap.connect('ecran', '');
    const renderer = ArcaneMap.createRenderer(document.getElementById('map-canvas'), {});
    renderer.setOption('showCoords', false);

    const statut = document.getElementById('ecran-statut');
    const titre = document.getElementById('ecran-titre');

    function appliquerCarte(payload) {
      // Projection éventuellement allégée : voir map-core.setMap().
      if (!renderer.setMap(payload)) {
        socket.emit('mapRequest');
        return;
      }
      document.getElementById('carte-vide').hidden = !!payload;
      titre.textContent = payload?.nom || '';
    }

    socket.on('mapState', appliquerCarte);
    socket.on('mapDrawPreview', apercu => renderer.pushPreview(apercu));
    socket.on('connect', () => {
      statut.textContent = '🟢 Synchronisé';
      socket.emit('mapRequest');
    });
    socket.on('disconnect', () => { statut.textContent = '🔴 Reconnexion…'; });
    socket.on('connect_error', () => { statut.textContent = '🔴 Serveur injoignable'; });

    // --- Vue affichée : choisie par le MJ depuis son interface ----------------
    function afficher(vue) {
      document.querySelectorAll('[data-vue]').forEach(b => b.classList.toggle('actif', b.dataset.vue === vue));
      document.getElementById('vue-carte').hidden = vue !== 'carte';
      document.getElementById('vue-tableau').hidden = vue !== 'tableau';

      const conteneur = document.getElementById('vue-tableau');
      if (vue === 'tableau' && !conteneur.firstElementChild) {
        const cadre = document.createElement('iframe');
        cadre.src = 'tableau.html?role=viewer&embed=1';
        cadre.title = 'Tableau blanc';
        conteneur.appendChild(cadre);
      }
      if (vue === 'carte') renderer.resize();
    }

    // Le serveur envoie la vue à la connexion, puis à chaque choix du MJ.
    socket.on('ecranVue', ({ vue } = {}) => afficher(vue === 'tableau' ? 'tableau' : 'carte'));

    // --- Initiative : affichée pendant un combat, par-dessus la vue ---------
    // Projection « table » : les créatures cachées par le MJ n'y figurent pas.
    const echapper = valeur => String(valeur ?? '').replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    async function chargerInitiative() {
      let etat;
      try { etat = await (await fetch('/api/initiative')).json(); } catch (_) { return; }
      const panneau = document.getElementById('initiative');
      panneau.hidden = !etat.actif || !etat.entrees.length;
      if (panneau.hidden) return;
      document.getElementById('initiative-round').textContent = etat.round;
      document.getElementById('initiative-ordre').innerHTML = etat.entrees.map(e =>
        `<li class="${e.id === etat.courant ? 'courant' : ''}">${e.kind === 'mob' ? '👹' : '👤'} ${echapper(e.nom)}</li>`).join('');
      document.getElementById('initiative-cache').hidden = etat.courant !== null;
    }

    socket.on('initiativeUpdated', chargerInitiative);
    socket.on('connect', chargerInitiative);

    document.getElementById('btn-plein-ecran').addEventListener('click', () => {
      if (document.fullscreenElement) document.exitFullscreen?.();
      else document.documentElement.requestFullscreen?.();
    });
  })();
  </script>
</body>
</html>
