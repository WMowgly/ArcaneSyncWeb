<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interface de Jeu</title>
  <link href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="police-lisible.css"/>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    /* Largeur adaptée : trois colonnes de champs restent lisibles. */
    body > .section { max-width: min(1200px, 100%); }
    .section .section { max-width: none; }
    .notes-textarea {
      width: 100%; min-height: 120px; resize: vertical; box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, sans-serif; font-size: 15px; padding: 8px 10px;
      border: 2px solid #8b5e3c; border-radius: 6px; background: #fffef8;
    }
    @media (max-width: 760px) {
      .section .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 480px) {
      .section .grid { grid-template-columns: minmax(0, 1fr); }
    }

    /* Lecture seule : valeurs de référence (nom, maximums...), affichées
       sans cadre de saisie. Modifiable : champ clair au cadre plein. */
    .section input[readonly] {
      background: transparent;
      border: 2px dashed #c9b28c;
      box-shadow: none;
      color: #5c3b21;
      cursor: default;
    }
    .section input:not([readonly]):not([type="checkbox"]) {
      background: #fffef8;
      border-color: #8b5e3c;
    }
    .section input:not([readonly]):not([type="checkbox"]):focus {
      outline: 2px solid #d4af37;
    }
    .legende-champs { margin: 22px 0 0; font-size: 13px; color: #6b5135; text-align: right; }
    .legende-champs span { padding: 1px 6px; border-radius: 4px; margin-right: 4px; }
    .legende-modifiable { border: 2px solid #8b5e3c; background: #fffef8; }
    .legende-lecture { border: 2px dashed #c9b28c; }
    .field label small { font-weight: normal; font-size: 12px; opacity: .8; }

    .player-stats-section { margin: 24px 0 34px; }
    /* Les encarts de notes, séparés entre eux et des statistiques. */
    .notes-panel { margin-top: 30px; }
    .player-stats-section h3 { margin: 0 0 10px; }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }
    .stat-chip {
      display: flex; justify-content: space-between; align-items: baseline;
      padding: 6px 10px; border: 2px dashed #c9b28c; border-radius: 6px;
    }
    .stat-chip span { font-size: 14px; }
    .stat-chip strong { font-size: 18px; }
    @media (max-width: 700px) { .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  </style>
</head>
<body>

  <h1>Interface de Jeu</h1>


  <div class="section">
    <h2>Interface de Jeu</h2>
    <p class="legende-champs">
      <span class="legende-modifiable">Modifiable</span>
      <span class="legende-lecture">Lecture seule</span>
    </p>
    <div class="grid">
      <div class="field"><label>Nom</label><input id="player_name" type="text" readonly></div>
      <div class="field"><label>Classe</label><input id="player_class" type="text" readonly></div>
      <div class="field"><label>Race</label><input id="player_race" type="text" readonly></div>
      <div class="field">
        <label>Jets de survie</label>
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <!-- Ligne des "Réussi" -->
          <div style="display: flex; align-items: center;">
            <span class="divider-span">Réussi</span>
            <div style="display: flex; gap: 20px;">
              <input type="checkbox" name="survie1" value="reussi">
              <input type="checkbox" name="survie2" value="reussi">
              <input type="checkbox" name="survie3" value="reussi">
            </div>
          </div>
          <!-- Ligne des "Echec" -->
          <div style="display: flex; align-items: center;">
            <span class="divider-span">Échec</span>
            <div style="display: flex; gap: 20px;">
              <input type="checkbox" name="survie1" value="echec">
              <input type="checkbox" name="survie2" value="echec">
              <input type="checkbox" name="survie3" value="echec">
            </div>
          </div>
        </div>
      </div>

      <div class="field">
        <label>Vie <small>actuelle / max</small></label>
        <div class="dual-input">
          <input type="number" id="player_hp_current" min="0" placeholder="Min">
          <span class="divider-span">/</span>
          <input type="number" id="player_hp" readonly>
        </div>
      </div>

      <div class="field">
        <label>Mana <small>actuel / max</small></label>
        <div class="dual-input">
          <input type="number" id="player_mana_current" min="0" placeholder="Min">
          <span class="divider-span">/</span>
          <input type="number" id="player_mana" readonly>
        </div>
      </div>

      <div class="field">
        <label>Durabilité <small>actuelle / max</small></label>
        <div class="dual-input">
          <input type="number" id="player_dura_current" min="0" placeholder="0">
          <span class="divider-span">/</span>
          <input type="number" id="player_dura_max" placeholder="Max" readonly>
        </div>
      </div>

      <div class="field">
        <label>État de l'armure</label>
        <input type="text" id="player_armor" readonly>
        <div id="armor_effect" class="status-text"></div>
      </div>

      <div class="field">
        <label>Protection <small>actuelle / max</small></label>
        <div class="dual-input">
          <input type="number" id="player_protection_current" min="0" placeholder="0">
          <span class="divider-span">/</span>
          <input type="number" id="player_protection_max" placeholder="Max" readonly>
        </div>
      </div>

      <div class="field" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
        <div style="display: flex; flex-direction: column;">
          <label>Vie bonus</label>
          <input type="number" id="player_vie_bonus" min="0" placeholder="0">
        </div>
        <div style="display: flex; flex-direction: column;">
          <label>Intox.</label>
          <input type="number" id="player_intox" placeholder="0" min="0" max="100">
        </div>
      </div>

    </div><!-- fin du grid -->
    <!-- Caractéristiques de référence du personnage (lecture seule). Les
         statuts (poison, agonie...) restent gérés par le MJ, sans affichage
         côté joueur. -->
    <div class="player-stats-section">
      <h3>Statistiques</h3>
      <div id="player-stats" class="stats-grid"></div>
    </div>

    <section class="section notes-panel" id="personal-notes-panel">
      <h2>📝 Mes notes personnelles</h2>
      <p>Ces notes sont personnelles à votre personnage. Le MJ peut les consulter et les modifier.</p>
      <textarea id="personal-notes-input" class="notes-textarea" placeholder="Écrire vos notes de partie..."></textarea>
      <div class="notes-actions">
        <button id="personal-notes-save" class="game-button" type="button">Sauvegarder mes notes</button>
        <span id="personal-notes-status"></span>
      </div>
    </section>

    <section class="section notes-panel" id="public-notes-panel">
      <h2>📢 Notes publiques du MJ</h2>
      <div id="public-notes-list"><p>Chargement...</p></div>
    </section>

    <div style="text-align: center; margin-top: 30px;">
      <button id="save-btn" class="game-button">
        Sauvegarder
      </button>
    </div>
  </div><!-- fin de la section h2 -->
  <div style="text-align: center; margin-top: 30px;">
    <button id="fiche-btn" class="game-button">
      Voir Fiche de Perso
    </button>
  </div>
  <script src="navbar.js"></script>
  <script>
    let params;
    let etatServeur = null;   // dernier état officiel reçu du serveur


    function escapeNotesHtml(value) {
      return String(value ?? '')
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;')
        .replace(/'/g,'&#039;');
    }

    function formatNotesDate(value) {
      try { return new Date(value).toLocaleString('fr-FR'); }
      catch { return value || ''; }
    }

    const STATISTIQUES = [
      ['force', 'Force'], ['dexterite', 'Dextérité'], ['magie', 'Magie'],
      ['constitution', 'Constitution'], ['charisme', 'Charisme'],
      ['perception', 'Perception'], ['chance', 'Chance'], ['intelligence', 'Intelligence']
    ];

    function renderStats(stats) {
      document.getElementById('player-stats').innerHTML = STATISTIQUES
        .map(([cle, libelle]) => `<div class="stat-chip"><span>${libelle}</span><strong>${escapeNotesHtml(stats?.[cle] ?? 0)}</strong></div>`)
        .join('');
    }

    function renderPublicNotes(notes) {
      const container=document.getElementById('public-notes-list');
      if(!notes.length){ container.innerHTML='<p>Aucune note publique du MJ.</p>'; return; }
      container.innerHTML=notes.map(note=>`
        <article class="public-note-card">
          <h3>${escapeNotesHtml(note.title || 'Note du MJ')}</h3>
          <div>${escapeNotesHtml(note.content).replace(/\n/g,'<br>')}</div>
          <small>Dernière modification : ${escapeNotesHtml(formatNotesDate(note.updatedAt))}</small>
        </article>
      `).join('');
    }

    async function loadPersonalNotes() {
      const playerId=params.get('PlayerId');
      if(!playerId)return;
      const r=await fetch(`/api/session/player/${encodeURIComponent(playerId)}/personal-notes?role=player&playerId=${encodeURIComponent(playerId)}`);
      const x=await r.json();
      if(!r.ok)throw new Error(x.message||'Impossible de charger les notes personnelles.');
      document.getElementById('personal-notes-input').value=x.content||'';
    }

    async function savePersonalNotes() {
      const playerId=params.get('PlayerId');
      const status=document.getElementById('personal-notes-status');
      const content=document.getElementById('personal-notes-input').value;
      try{
        const r=await fetch(`/api/session/player/${encodeURIComponent(playerId)}/personal-notes`,{
          method:'PUT',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({role:'player',playerId,content})
        });
        const x=await r.json();
        if(!r.ok)throw new Error(x.message||'Impossible de sauvegarder les notes.');
        status.textContent='Notes personnelles sauvegardées.';
        status.style.color='#2e7d32';
      }catch(e){
        status.textContent=e.message; status.style.color='#a52a2a';
      }
    }

    async function loadPublicNotes() {
      const r=await fetch('/api/session/public-notes');
      const x=await r.json();
      if(!r.ok)throw new Error(x.message||'Impossible de charger les notes publiques.');
      renderPublicNotes(x.notes||[]);
    }

    window.addEventListener('DOMContentLoaded', async () => {
      params = new URLSearchParams(window.location.search);
      initializeFields();
      setupValidators();
      setupSurvie();
      updateArmorState();

      // Pour afficher le nom du joueur dans le titre
      const nom = params.get("Nom");
      if (nom) {
        document.querySelector("h1").innerText = `Interface de Jeu – ${nom}`;
      }

      const duraCurrent = document.getElementById('player_dura_current');
      if (duraCurrent) {
        duraCurrent.addEventListener('input', updateArmorState);
      }

      // Les paramètres de l'URL servent uniquement à l'initialisation.
      // L'état officiel est ensuite récupéré depuis le serveur.
      await refreshSessionFromServer();

      document.getElementById('personal-notes-save')?.addEventListener('click', savePersonalNotes);

      try {
        await loadPersonalNotes();
        await loadPublicNotes();
      } catch(error) {
        console.error('Erreur chargement des notes:', error);
      }

      // Toute modification provenant d'une autre interface/client doit
      // immédiatement être répercutée ici.
      const socket = io({
        query:{role:'player',playerId:params.get('PlayerId')},
        reconnection: true,
        reconnectionDelay: 1000,
        reconnectionDelayMax: 5000,
        reconnectionAttempts: Infinity
      });

      // V1.12 : à chaque connexion/reconnexion, le serveur envoie un
      // snapshot autoritaire limité à ce joueur.
      socket.on('connect', () => {
        console.log('V1.12 — connexion/reconnexion établie, demande de resynchronisation.');
        socket.emit('stateSyncRequest');
      });

      socket.on('stateSync', async (snapshot) => {
        if (!snapshot || snapshot.role !== 'player') return;
        if (snapshot.playerId && snapshot.playerId !== params.get('PlayerId')) return;

        if (snapshot.player) {
          applySessionState(snapshot.player);
        }

        try {
          await loadPersonalNotes();
          await loadPublicNotes();
        } catch (error) {
          console.error('Erreur lors de la resynchronisation des données complémentaires:', error);
        }
      });

      socket.on('stateSyncError', (event) => {
        console.error('Resynchronisation impossible:', event?.message || 'Erreur inconnue');
      });

      // Les changements de session sont propagés uniquement aux
      // Interfaces de Jeu. La Fiche de Perso n'écoute pas cet événement.
      socket.on('sessionPlayerUpdate', async (event) => {
        if (!event || event.playerId !== params.get("PlayerId")) return;

        if (event.session) {
          applySessionState(event.session);
        } else {
          await refreshSessionFromServer();
        }
      });

      socket.on('personalNotesUpdated', async (event) => {
        if(event?.playerId===params.get('PlayerId')) {
          try { await loadPersonalNotes(); } catch(e) { console.error(e); }
        }
      });

      socket.on('publicNotesUpdated', async () => {
        try { await loadPublicNotes(); } catch(e) { console.error(e); }
      });

      socket.on('playerUpdate', async (event) => {
        if (!event) return;

        const sameId = event.playerId && event.playerId === params.get("PlayerId");
        const sameLegacyName = !event.playerId && event.player === nom;

        if (!sameId && !sameLegacyName) return;

        await refreshSessionFromServer();
      });
    });

    async function refreshSessionFromServer() {
      const playerId = params?.get("PlayerId");
      const playerName = params?.get("Nom");

      if (!playerId && !playerName) return;

      try {
        let sessionPlayer;

        if (playerId) {
          const response = await fetch(
            `/api/session/player/${encodeURIComponent(playerId)}`
          );

          if (!response.ok) {
            throw new Error(`Erreur HTTP ${response.status}`);
          }

          sessionPlayer = await response.json();
        } else {
          // Compatibilité avec les anciennes URLs : on récupère les
          // personnages pour retrouver l'ID, puis on charge la session.
          const response = await fetch('/api/joueurs');

          if (!response.ok) {
            throw new Error(`Erreur HTTP ${response.status}`);
          }

          const joueurs = await response.json();
          const joueur = joueurs.find(
            player => typeof player.nom === 'string' &&
              player.nom.toLowerCase() === playerName.toLowerCase()
          );

          if (!joueur) {
            console.warn(`Joueur introuvable : ${playerName}`);
            return;
          }

          params.set("PlayerId", joueur.id);

          const sessionResponse = await fetch(
            `/api/session/player/${encodeURIComponent(joueur.id)}`
          );

          if (!sessionResponse.ok) {
            throw new Error(`Erreur HTTP ${sessionResponse.status}`);
          }

          sessionPlayer = await sessionResponse.json();
        }

        applySessionState(sessionPlayer);
      } catch (error) {
        console.error('Erreur lors de la synchronisation de session:', error);
      }
    }

    function applySessionState(joueur) {
      document.getElementById('player_name').value = joueur.nom || '';
      document.getElementById('player_class').value = joueur.classe || '';
      document.getElementById('player_race').value = joueur.race || '';

      document.getElementById('player_hp').value = joueur.hp?.max ?? 0;
      document.getElementById('player_hp_current').value = joueur.hp?.current ?? 0;
      document.getElementById('player_mana').value = joueur.mana?.max ?? 0;
      document.getElementById('player_mana_current').value = joueur.mana?.current ?? 0;

      document.getElementById('player_dura_max').value = joueur.armure?.durabilite?.max ?? 0;
      document.getElementById('player_dura_current').value = joueur.armure?.durabilite?.current ?? 0;
      document.getElementById('player_protection_max').value = joueur.armure?.protection?.max ?? 0;
      document.getElementById('player_protection_current').value = joueur.armure?.protection?.current ?? 0;

      document.getElementById('player_vie_bonus').value = joueur.bonus_vie ?? 0;
      document.getElementById('player_intox').value = joueur.intox ?? 0;
      if (joueur.stats) renderStats(joueur.stats);

      // Jets de survie : état de la partie.
      for (let i = 0; i < 3; i++) {
        document.querySelector(`input[name="survie${i + 1}"][value="reussi"]`).checked = joueur.survie?.reussi?.[i] === true;
        document.querySelector(`input[name="survie${i + 1}"][value="echec"]`).checked = joueur.survie?.echec?.[i] === true;
      }

      // L'état officiel est conservé ici : la sauvegarde s'en sert au lieu de
      // relire l'URL, qui ne porte plus que l'identifiant du personnage.
      etatServeur = joueur;
      if (joueur.id) {
        params = new URLSearchParams({ PlayerId: joueur.id });
        window.history.replaceState({}, '', `${window.location.pathname}?${params.toString()}`);
      }
      if (joueur.nom) {
        document.querySelector("h1").innerText = `Interface de Jeu – ${joueur.nom}`;
      }

      bornerRessources();
      updateArmorState();
      console.log('État serveur synchronisé pour :', joueur.nom);
    }

    // Le personnage est entièrement chargé depuis le serveur (l'URL ne porte
    // que son identifiant) : en attendant, les statistiques sont vides.
    function initializeFields() {
      renderStats({});
    }

    /** Jets de survie : enregistrés dans la partie dès qu'une case change. */
    function lireSurvie() {
      const cases = valeur => [1, 2, 3].map(i =>
        document.querySelector(`input[name="survie${i}"][value="${valeur}"]`).checked);
      return { reussi: cases('reussi'), echec: cases('echec') };
    }

    function setupSurvie() {
      document.querySelectorAll('input[name^="survie"]').forEach(caseSurvie => {
        caseSurvie.addEventListener('change', async () => {
          const playerId = params.get('PlayerId');
          if (!playerId) return;
          try {
            const reponse = await fetch('/api/session/player', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ id: playerId, nouvellesDonnees: { survie: lireSurvie() } })
            });
            if (!reponse.ok) throw new Error(`Erreur HTTP ${reponse.status}`);
          } catch (erreur) {
            console.error('Jets de survie non enregistrés :', erreur);
          }
        });
      });
    }

    // Valeur actuelle / maximum : la saisie est bloquée entre 0 et le
    // maximum (le serveur applique aussi cette borne).
    const PAIRES_RESSOURCES = [
      ['player_hp_current', 'player_hp'],
      ['player_mana_current', 'player_mana'],
      ['player_dura_current', 'player_dura_max'],
      ['player_protection_current', 'player_protection_max']
    ];

    function bornerRessources() {
      PAIRES_RESSOURCES.forEach(([idActuel, idMax]) => {
        const actuel = document.getElementById(idActuel);
        const max = document.getElementById(idMax);
        if (!actuel || !max || max.value === '') return;
        const maximum = Math.max(0, Number(max.value) || 0);
        actuel.min = 0;
        actuel.max = maximum;
        if (actuel.value !== '' && Number(actuel.value) > maximum) actuel.value = maximum;
        if (actuel.value !== '' && Number(actuel.value) < 0) actuel.value = 0;
      });
    }

    function setupValidators() {
      PAIRES_RESSOURCES.forEach(([idActuel]) => {
        const actuel = document.getElementById(idActuel);
        if (!actuel) return;
        actuel.addEventListener('input', () => { bornerRessources(); updateArmorState(); });
      });
    }

    function updateArmorState() {
      const duraMax = parseInt(document.getElementById('player_dura_max').value) || 0;
      const duraCurrent = parseInt(document.getElementById('player_dura_current').value) || 0;
      const armorStateInput = document.getElementById('player_armor');
      const armorStateEffect = document.getElementById('armor_effect');
      
      let etat = '';
      let couleur = '';
      let effect = '';
      
      if (duraCurrent === 0) {
        etat = "Absence d'armure";
        couleur = '#000000';
        couleurs = '#000000';
        effect = 'Plus aucune protection';
      } else if (duraCurrent >= ((duraMax/3)*2)+1) {
        etat = 'Armure Neuve';
        couleur = '#2e7d32';
        couleurs = '#000000';
        effect = 'Protection maximale';
      } else if (duraCurrent >= (duraMax/3)+1) {
        etat = 'Armure Abîmée';
        couleur = '#ff9800';
        couleurs = '#000000';
        effect = 'Bonus fixe supprimé';
      } else {
        etat = 'Armure Très Abîmée';
        couleur = '#d32f2f';
        couleurs = '#000000';
        effect = 'Résultat du jet réduite de moitié';
      }
      
      armorStateInput.value = etat;
      armorStateInput.style.color = couleur;
      armorStateEffect.textContent = effect;
      armorStateEffect.style.color = couleurs;
    }
    </script>
    <script>
        // La fiche se charge depuis le serveur : seul l'identifiant est transmis.
        document.getElementById("fiche-btn").addEventListener("click", () => {
          const id = new URLSearchParams(window.location.search).get('PlayerId') || '';
          window.location.href = `fiche_perso.html?PlayerId=${encodeURIComponent(id)}`;
        });
    </script>
    <script>
      // Sauvegarde de l'état de jeu (valeurs actuelles, vie bonus, intox,
      // jets de survie) dans la partie. Tout le reste vient de l'état chargé
      // depuis le serveur, jamais de l'URL.
      document.getElementById("save-btn").addEventListener("click", async () => {
        try {
          const playerId = params.get("PlayerId");
          if (!playerId || !etatServeur) {
            throw new Error('Personnage non chargé : rechargez la page.');
          }
          const entier = id => parseInt(document.getElementById(id).value) || 0;

          const nouvellesDonnees = {
            hp: { max: entier('player_hp'), current: entier('player_hp_current') },
            mana: { max: entier('player_mana'), current: entier('player_mana_current') },
            armure: {
              type: etatServeur.armure?.type || '',
              resistance: etatServeur.armure?.resistance || '',
              durabilite: { max: entier('player_dura_max'), current: entier('player_dura_current') },
              protection: { max: entier('player_protection_max'), current: entier('player_protection_current') }
            },
            bonus_vie: entier('player_vie_bonus'),
            intox: document.getElementById('player_intox').value || '0',
            survie: lireSurvie()
          };

          const response = await fetch('/api/session/player', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: playerId, nouvellesDonnees })
          });

          if (!response.ok) {
            const errorText = await response.text();
            throw new Error(`Erreur HTTP ${response.status}: ${errorText}`);
          }

          await response.json();
          alert('État de session sauvegardé avec succès !');
        } catch (error) {
          console.error('Erreur détaillée:', error);
          alert(`Erreur lors de la sauvegarde: ${error.message}`);
        }
    });
    </script>
</body>
</html>
