<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liste - ArcaneSync</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="police-lisible.css"/>
  <link rel="icon" type="image/png" href="img/icon.png"/>
  <style>
    .stat-bar-container {
      margin: 8px 0;
      width: 100%;
    }

    .stat-bar {
      position: relative;
      width: 100%;
      height: 25px;
      background: #e0e0e0;
      border: 2px solid #8b5e3c;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: inset 0 2px 4px rgba(139, 94, 60, 0.2);
    }

    .stat-bar-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      transition: width 0.3s ease;
    }

    .hp-bar {
      background: linear-gradient(to right, #8b3e3c, #bc5854);
    }

    .mana-bar {
      background: linear-gradient(to right, #3c5e8b, #5485bc);
    }

    .stat-bar-text {
      position: absolute;
      width: 100%;
      text-align: center;
      line-height: 25px;
      color: #fefae0;
      font-weight: bold;
      text-shadow:
        -1px -1px 0 #000,
        1px -1px 0 #000,
        -1px 1px 0 #000,
        1px 1px 0 #000;
      z-index: 1;
      font-family: 'Uncial Antiqua', cursive;
    }
    .card {
      background: #fefae0;
      border: 2px solid #8b5e3c;
      border-radius: 10px;
      padding: 0;
      margin: 0;
      box-shadow: 0 2px 4px rgba(139, 94, 60, 0.2);
      overflow: hidden;
    }
    .selection-aide { text-align: center; margin: -24px 0 18px; opacity: .8; }

    /* Toute la carte est un lien vers l'Interface de Jeu. */
    .carte-perso { display: block; padding: 14px 16px 12px; color: inherit; text-decoration: none; }
    .carte-perso:hover, .carte-perso:focus-visible { background: #fff4d6; }
    .carte-perso h3 { margin: 0; font-size: 20px; }
    .carte-perso .identite { margin: 2px 0 8px; opacity: .8; }
    .carte-perso .stat-bar-container { margin: 6px 0; }
    .carte-perso .stat-bar-container label { display: block; margin: 0 0 3px; font-size: 13px; }
    .carte-perso .intox { margin: 6px 0 0; font-size: 14px; opacity: .85; }
    .carte-perso .jouer {
      display: block; margin-top: 10px; padding: 10px; border-radius: 8px; text-align: center;
      background: #8b5e3c; color: #fefae0; font-weight: 700;
    }
    /* Suppression : visible seulement sur l'appareil du MJ (code mémorisé). */
    .card .delete-btn {
      display: block; width: calc(100% - 32px); margin: 0 16px 12px; padding: 7px; cursor: pointer;
      border: 1px solid #8b3e3c; border-radius: 6px; background: #f7e2e2; color: #7a2222; font: inherit; font-size: 14px;
    }
    @media (max-width: 600px) {
      .page-personnages h1 { margin-bottom: 18px; }
      .selection-aide { margin: -10px 0 14px; font-size: 14px; }
      .page-personnages #joueurs-list { gap: 12px; }
    }
  </style>
  <link rel="stylesheet" href="joueur-mobile.css"/>
  <script src="/socket.io/socket.io.js"></script>
  <script src="mj-code.js"></script>
</head>
<body class="page-personnages">
  <div id="navbar-placeholder"></div>
  <h1>Choisissez votre personnage</h1>
  <p class="selection-aide">Touchez votre personnage pour ouvrir son Interface de Jeu.</p>
  <div id="joueurs-list"></div>
</body>
  <script src="navbar.js"></script>
  <script type="module">
    import { lienInterfaceJeu } from './popupjoueur.js';

    const echapper = valeur => String(valeur ?? '').replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    // Fonction pour charger et afficher les joueurs
    function loadAndDisplayPlayers() {
      fetch('/api/session/players')
        .then(response => response.json())
        .then(joueurs => {
          const listContainer = document.getElementById('joueurs-list');
          listContainer.innerHTML = '';

          if (joueurs.length === 0) {
            listContainer.innerHTML = '<p>Aucun personnage pour l\'instant : créez-en un depuis le menu.</p>';
            return;
          }

          // Les joueurs ne suppriment pas de personnage : le bouton n'apparaît
          // que sur l'appareil du MJ.
          const appareilMj = window.ArcaneMJ?.aUnCode?.() === true;

          joueurs.forEach(joueur => {
            const card = document.createElement('div');
            card.classList.add('card');
            card.setAttribute('data-id', joueur.id);

            const hpPercentage = (joueur.hp?.max > 0) ? ((joueur.hp?.current || 0) / joueur.hp?.max) * 100 : 0;
            const manaPercentage = (joueur.mana?.max > 0) ? ((joueur.mana?.current || 0) / joueur.mana?.max) * 100 : 0;


            card.innerHTML = `
              <a class="carte-perso" href="${echapper(lienInterfaceJeu(joueur))}">
                <h3>${echapper(joueur.nom)}</h3>
                <p class="identite">${echapper(joueur.classe)} · ${echapper(joueur.race)}</p>
                <div class="stat-bar-container">
                  <label>Points de Vie</label>
                  <div class="stat-bar">
                    <div class="stat-bar-fill hp-bar" style="width: ${hpPercentage}%"></div>
                    <div class="stat-bar-text">${joueur.hp?.current || 0} / ${joueur.hp?.max || 0}</div>
                  </div>
                </div>
                <div class="stat-bar-container">
                  <label>Points de Mana</label>
                  <div class="stat-bar">
                    <div class="stat-bar-fill mana-bar" style="width: ${manaPercentage}%"></div>
                    <div class="stat-bar-text">${joueur.mana?.current || 0} / ${joueur.mana?.max || 0}</div>
                  </div>
                </div>
                <p class="intox">Intox : ${echapper(joueur.intox ?? 0)} / ${echapper(joueur?.stats?.constitution ?? 0)}</p>
                <span class="jouer">Jouer ▶</span>
              </a>
              ${appareilMj ? '<button class="delete-btn" type="button">Supprimer (MJ)</button>' : ''}
            `;

            card.querySelector('.delete-btn')?.addEventListener('click', (e) => {
              e.stopPropagation();
              if (confirm(`Supprimer le joueur ${joueur.nom} ?`)) {
                // V1.13.5 : la suppression exige désormais le rôle MJ.
                fetch(`/api/joueurs/delete/${encodeURIComponent(joueur.id)}`, {
                  method: 'DELETE',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ role: 'mj' })
                })
                .then(async res => {
                  const message = await res.text();
                  if (!res.ok) throw new Error(message || 'Suppression refusée.');
                  return message;
                })
                .then(message => {
                  console.log("Réponse serveur :", message);
                  card.remove();
                })
                .catch(err => {
                  console.error("Erreur suppression:", err);
                  alert("Erreur lors de la suppression du joueur.");
                });
              }
            });

            listContainer.appendChild(card);
          });
        })
        .catch(err => {
          console.error("Erreur lors de la récupération des joueurs:", err);
          alert("Erreur lors de la récupération des joueurs.");
        });
    }

    // Charger les joueurs initialement
    loadAndDisplayPlayers();

    // Configurer WebSocket
    const socket = io({
      reconnection: true,
      reconnectionDelay: 1000,
      reconnectionDelayMax: 5000,
      reconnectionAttempts: Infinity
    });

    // Ajouter des événements de debug
    socket.on('connect', () => {
      console.log('V1.12 — connecté/reconnecté au serveur WebSocket');
      socket.emit('stateSyncRequest');
    });

    socket.on('stateSync', (snapshot) => {
      if (snapshot?.role === 'mj' || snapshot?.role === 'player') {
        loadAndDisplayPlayers();
      }
    });

    socket.on('stateSyncError', (event) => {
      console.error('Resynchronisation impossible:', event?.message || 'Erreur inconnue');
    });

    socket.on('disconnect', () => {
      console.log('Déconnecté du serveur WebSocket');
    });

    socket.on('connect_error', (error) => {
      console.error('Erreur de connexion WebSocket:', error);
    });

    // Écouter les mises à jour
    socket.on('sessionUpdated', (data) => {
      console.log('Mise à jour de la partie reçue:', data);
      loadAndDisplayPlayers();
    });

    socket.on('playerUpdate', (data) => {
      console.log('Mise à jour reçue:', data);
      loadAndDisplayPlayers(); // Recharger la liste des joueurs
    });
  </script>
</html>
